# ── DevGodzilla ──────────────────────────────────────────────────────────────
# Modern Python project configuration (PEP 621)
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devgodzilla"
version = "0.1.0"
description = "DevGodzilla: Integrated AI-Driven Development Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DevGodzilla Team" }]
keywords = ["ai", "development", "platform", "fastapi", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# ── Runtime dependencies ─────────────────────────────────────────────────────
dependencies = [
    "fastapi==0.124.0",
    "uvicorn==0.38.0",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "authlib==1.4.1",
    "itsdangerous==2.2.0",
    "redis==7.1.0",
    "rq==2.6.1",
    "prometheus-client==0.23.1",
    "psycopg[binary,pool]==3.3.2",
    "psycopg2-binary==2.9.10",
    "alembic==1.17.2",
    "SQLAlchemy==2.0.44",
    "textual==6.7.1",
    "jsonschema==4.22.0",
    "psutil==6.1.0",
    "PyYAML==6.0.2",
    "websockets==12.0",
]

# ── Optional dependency groups ───────────────────────────────────────────────
[project.optional-dependencies]
# OpenTelemetry distributed tracing
otel = [
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp==1.27.0",
    "opentelemetry-instrumentation==0.48b0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "opentelemetry-instrumentation-httpx==0.48b0",
    "opentelemetry-instrumentation-redis==0.48b0",
    "opentelemetry-instrumentation-requests==0.48b0",
]

# Development & testing tools
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "hypothesis==6.122.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Convenience: install everything (otel + dev)
all = [
    "devgodzilla[otel,dev]",
]

# ── Hatch build configuration ────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["devgodzilla"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["devgodzilla", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["devgodzilla"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
